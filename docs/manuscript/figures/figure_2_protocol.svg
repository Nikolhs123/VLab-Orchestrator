<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #123b3a; }
      .heading { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #123b3a; }
      .body { font-family: Arial, sans-serif; font-size: 25px; fill: #344a47; }
      .number { font-family: Arial, sans-serif; font-size: 29px; font-weight: 700; fill: #ffffff; dominant-baseline: middle; }
      .box { stroke: #2b6663; stroke-width: 3; }
      .flow { stroke: #d66b2f; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 Z" fill="#d66b2f"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="65" y="62" class="title">Deterministic scenario and evidence lifecycle</text>

  <line x1="160" y1="145" x2="1440" y2="145" stroke="#d9e2e0" stroke-width="10" stroke-linecap="round"/>

  <g transform="translate(45 0)">
    <circle cx="115" cy="145" r="34" fill="#205d5b"/>
    <text x="115" y="145" text-anchor="middle" class="number">1</text>
    <rect x="0" y="205" width="230" height="145" rx="24" class="box" fill="#edf5f1"/>
    <text x="115" y="252" text-anchor="middle" class="heading">Configure</text>
    <text x="115" y="295" text-anchor="middle" class="body">Backend, scenario,</text>
    <text x="115" y="328" text-anchor="middle" class="body">users and timing</text>
  </g>
  <g transform="translate(355 0)">
    <circle cx="115" cy="145" r="34" fill="#205d5b"/>
    <text x="115" y="145" text-anchor="middle" class="number">2</text>
    <rect x="0" y="205" width="230" height="145" rx="24" class="box" fill="#edf5f1"/>
    <text x="115" y="252" text-anchor="middle" class="heading">Synchronize</text>
    <text x="115" y="295" text-anchor="middle" class="body">Wait for users and</text>
    <text x="115" y="328" text-anchor="middle" class="body">shared runtime</text>
  </g>
  <g transform="translate(665 0)">
    <circle cx="115" cy="145" r="34" fill="#d66b2f"/>
    <text x="115" y="145" text-anchor="middle" class="number">3</text>
    <rect x="0" y="205" width="230" height="145" rx="24" class="box" fill="#fff2e8"/>
    <text x="115" y="252" text-anchor="middle" class="heading">Execute</text>
    <text x="115" y="295" text-anchor="middle" class="body">Request, rotate,</text>
    <text x="115" y="328" text-anchor="middle" class="body">hold and release</text>
  </g>
  <g transform="translate(975 0)">
    <circle cx="115" cy="145" r="34" fill="#205d5b"/>
    <text x="115" y="145" text-anchor="middle" class="number">4</text>
    <rect x="0" y="205" width="230" height="145" rx="24" class="box" fill="#edf5f1"/>
    <text x="115" y="252" text-anchor="middle" class="heading">Validate</text>
    <text x="115" y="295" text-anchor="middle" class="body">Commands, cycles,</text>
    <text x="115" y="328" text-anchor="middle" class="body">transfers, tolerance</text>
  </g>
  <g transform="translate(1285 0)">
    <circle cx="115" cy="145" r="34" fill="#205d5b"/>
    <text x="115" y="145" text-anchor="middle" class="number">5</text>
    <rect x="0" y="205" width="230" height="145" rx="24" class="box" fill="#edf5f1"/>
    <text x="115" y="252" text-anchor="middle" class="heading">Export</text>
    <text x="115" y="295" text-anchor="middle" class="body">Records, summaries,</text>
    <text x="115" y="328" text-anchor="middle" class="body">manifest, metadata</text>
  </g>

  <path d="M1400 350 L1400 470 L1115 470" class="flow"/>
  <rect x="690" y="410" width="400" height="120" rx="26" class="box" fill="#e8f4eb"/>
  <text x="890" y="457" text-anchor="middle" class="heading">VALID</text>
  <text x="890" y="500" text-anchor="middle" class="body">Retain export for analysis</text>

  <path d="M1400 350 L1400 650 L1115 650" class="flow"/>
  <rect x="690" y="590" width="400" height="120" rx="26" class="box" fill="#f9e7e4"/>
  <text x="890" y="637" text-anchor="middle" class="heading">INVALID / INTERRUPTED</text>
  <text x="890" y="680" text-anchor="middle" class="body">Retain evidence; do not analyse</text>

  <rect x="45" y="430" width="555" height="245" rx="26" fill="#f7f9f8" stroke="#8ca09d" stroke-width="3"/>
  <text x="80" y="482" class="heading">Interpretation boundary</text>
  <text x="80" y="535" class="body">Passing checks confirms protocol</text>
  <text x="80" y="571" class="body">completion only. It does not establish</text>
  <text x="80" y="607" class="body">backend equivalence, independent</text>
  <text x="80" y="643" class="body">replication, or statistical superiority.</text>
</svg>
