  <text x="182" y="578" text-anchor="middle" class="small">Adapter</text>
  <text x="442" y="545" text-anchor="middle" class="label">Photon Fusion</text>
  <text x="442" y="578" text-anchor="middle" class="small">Adapter</text>
  <text x="702" y="540" text-anchor="middle" class="label">Unity Netcode</text>
  <text x="702" y="572" text-anchor="middle" class="small">Adapter</text>
  <text x="962" y="545" text-anchor="middle" class="label">FishNet</text>
  <text x="962" y="578" text-anchor="middle" class="small">Adapter</text>
  <text x="1222" y="545" text-anchor="middle" class="label">Mirror</text>
  <text x="1222" y="578" text-anchor="middle" class="small">Adapter</text>

  <path d="M182 605 L182 654 L700 654" stroke="#d36b32" stroke-width="4" fill="none"/>
  <path d="M442 605 L442 654" stroke="#d36b32" stroke-width="4" fill="none"/>
  <path d="M702 605 L702 654" stroke="#d36b32" stroke-width="4" fill="none"/>
