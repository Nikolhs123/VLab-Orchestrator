  <path d="M1222 605 L1222 654 L700 654" stroke="#d36b32" stroke-width="4" fill="none"/>
  <path d="M700 654 L700 690" class="arrow"/>

  <rect x="245" y="690" width="910" height="88" class="box" fill="#dce9df"/>
  <text x="700" y="726" text-anchor="middle" class="label">Common evaluation layer</text>
