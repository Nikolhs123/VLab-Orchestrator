  <rect x="325" y="500" width="235" height="105" class="box" fill="#ffffff"/>
  <rect x="585" y="500" width="235" height="105" class="box" fill="#ffffff"/>
  <rect x="845" y="500" width="235" height="105" class="box" fill="#ffffff"/>
  <rect x="1105" y="500" width="235" height="105" class="box" fill="#ffffff"/>
