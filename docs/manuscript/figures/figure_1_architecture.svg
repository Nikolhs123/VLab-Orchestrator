<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font: 700 32px Georgia, serif; fill: #163b3a; }
      .label { font: 700 22px Georgia, serif; fill: #163b3a; }
      .body { font: 18px Georgia, serif; fill: #263331; }
      .small { font: 16px Georgia, serif; fill: #263331; }
      .box { stroke: #163b3a; stroke-width: 3; rx: 14; }
      .arrow { stroke: #d36b32; stroke-width: 4; fill: none; marker-end: url(#head); }
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d36b32"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#f4f0e5"/>
  <text x="700" y="52" text-anchor="middle" class="title">VLab Orchestrator layered architecture</text>

