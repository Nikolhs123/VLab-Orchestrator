<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <style>
      .h1 { font: 700 30px Arial, sans-serif; fill: #123b3a; }
      .step { font: 700 21px Arial, sans-serif; fill: #123b3a; }
      .body { font: 17px Arial, sans-serif; fill: #344a47; }
      .num { font: 700 22px Arial, sans-serif; fill: #ffffff; }
      .box { stroke: #2b6663; stroke-width: 2.5; rx: 16; }
      .flow { stroke: #d66b2f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#d66b2f"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="90" y="62" class="h1">Deterministic scenario and evidence lifecycle</text>

  <line x1="190" y1="185" x2="1410" y2="185" stroke="#d9e2e0" stroke-width="8"/>

  <g>
    <circle cx="190" cy="185" r="30" fill="#205d5b"/><text x="190" y="193" text-anchor="middle" class="num">1</text>
    <rect x="70" y="235" width="240" height="132" class="box" fill="#edf5f1"/>
    <text x="190" y="275" text-anchor="middle" class="step">Configure</text>
    <text x="190" y="309" text-anchor="middle" class="body">Backend, scenario,</text>
    <text x="190" y="335" text-anchor="middle" class="body">users and timing</text>
  </g>
  <g>
    <circle cx="495" cy="185" r="30" fill="#205d5b"/><text x="495" y="193" text-anchor="middle" class="num">2</text>
    <rect x="375" y="235" width="240" height="132" class="box" fill="#edf5f1"/>
    <text x="495" y="275" text-anchor="middle" class="step">Synchronize</text>
    <text x="495" y="309" text-anchor="middle" class="body">Wait for participants</text>
    <text x="495" y="335" text-anchor="middle" class="body">and shared runtime</text>
  </g>
  <g>
    <circle cx="800" cy="185" r="30" fill="#d66b2f"/><text x="800" y="193" text-anchor="middle" class="num">3</text>
    <rect x="680" y="235" width="240" height="132" class="box" fill="#fff2e8"/>
    <text x="800" y="275" text-anchor="middle" class="step">Execute</text>
    <text x="800" y="309" text-anchor="middle" class="body">Request · grant · rotate</text>
    <text x="800" y="335" text-anchor="middle" class="body">hold · release · repeat</text>
  </g>
  <g>
    <circle cx="1105" cy="185" r="30" fill="#205d5b"/><text x="1105" y="193" text-anchor="middle" class="num">4</text>
    <rect x="985" y="235" width="240" height="132" class="box" fill="#edf5f1"/>
    <text x="1105" y="275" text-anchor="middle" class="step">Check</text>
    <text x="1105" y="309" text-anchor="middle" class="body">Commands, cycles,</text>
    <text x="1105" y="335" text-anchor="middle" class="body">transfers and tolerance</text>
  </g>
  <g>
    <circle cx="1410" cy="185" r="30" fill="#205d5b"/><text x="1410" y="193" text-anchor="middle" class="num">5</text>
    <rect x="1290" y="235" width="240" height="132" class="box" fill="#edf5f1"/>
    <text x="1410" y="275" text-anchor="middle" class="step">Stage export</text>
    <text x="1410" y="309" text-anchor="middle" class="body">Raw rows, summaries,</text>
    <text x="1410" y="335" text-anchor="middle" class="body">manifest and metadata</text>
  </g>

  <path d="M1410 367 L1410 435 L1045 435" class="flow"/>
  <rect x="715" y="410" width="330" height="110" class="box" fill="#e8f4eb"/>
  <text x="880" y="452" text-anchor="middle" class="step">Checks passed</text>
  <text x="880" y="485" text-anchor="middle" class="body">Completed export retained for analysis</text>

  <path d="M1410 367 L1410 590 L1045 590" class="flow"/>
  <rect x="715" y="565" width="330" height="110" class="box" fill="#f9e7e4"/>
  <text x="880" y="607" text-anchor="middle" class="step">Check failed or interrupted</text>
  <text x="880" y="640" text-anchor="middle" class="body">Evidence retained and marked “do not use”</text>

  <rect x="70" y="455" width="500" height="190" rx="16" fill="#f7f9f8" stroke="#8ca09d" stroke-width="2"/>
  <text x="100" y="495" class="step">Interpretation boundary</text>
  <text x="100" y="532" class="body">Passing checks confirms protocol completion only.</text>
  <text x="100" y="565" class="body">It does not establish backend equivalence, external</text>
  <text x="100" y="598" class="body">replication or statistical superiority.</text>
</svg>
